[project]
name = "shipit-skill"
version = "0.3.1"
description = "One-pass launch pipeline Agent Skill for developer tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "PyYAML>=6.0",
    "pyright>=1.1.380",
]

[project.scripts]
shipit-skill = "shipit_skill.cli:main"

[tool.setuptools]
packages = ["shipit_skill"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
shipit_skill = ["templates/*", "templates/.dockerignore", "templates/promo/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
